name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck-build:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # O client tipado do Prisma é gerado a partir do schema e não vai para o
      # repositório. Sem ele, o typecheck e o build não encontram os tipos.
      - run: npm run db:generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run db:generate
      - run: npm run test

  integration-tests:
    name: Integration Tests (gate)
    runs-on: ubuntu-latest
    needs: [lint-typecheck-build, unit-tests]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run db:generate
      # A suíte e2e cria o próprio SQLite descartável no globalSetup, então não
      # é preciso subir serviço de banco nenhum aqui.
      - run: npm run test:e2e
