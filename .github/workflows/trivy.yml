name: Security - Dependências e IaC (Trivy)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # CVE nova aparece sem ninguém tocar no código: uma dependência que passou
    # limpa ontem pode estar vulnerável hoje. A varredura semanal pega isso
    # mesmo em período sem commit.
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write

concurrency:
  group: trivy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy:
    name: Trivy (gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Não roda `npm ci`: o Trivy lê o package-lock.json direto e resolve a
      # árvore inteira de dependências a partir dele, incluindo as transitivas.
      # Instalar antes só deixaria o job mais lento.
      - name: Trivy - relatório completo (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          # `secret` fica de fora porque o Gitleaks já cobre isso, com histórico
          # e sem duplicar achado no code scanning.
          scanners: vuln,misconfig
          format: sarif
          output: trivy.sarif
          # Este passo é só relatório; quem bloqueia é o gate lá embaixo. Se ele
          # falhasse aqui, o SARIF nunca seria gerado e o achado não apareceria
          # na aba Security.
          exit-code: '0'

      - name: Publica o SARIF no code scanning
        if: always() && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy.sarif
          category: trivy

      - name: Gate - falha em HIGH/CRITICAL com correção disponível
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          # `ignore-unfixed` porque uma CVE sem patch publicado não tem ação
          # possível no PR: bloquear o merge não corrige nada e só ensina o time
          # a ignorar o gate. Ela continua visível no relatório acima.
          ignore-unfixed: true
          exit-code: '1'
          # O banco de vulnerabilidades vem do GHCR e tem limite de download por
          # IP. Reaproveitar o cache entre os dois passos evita baixar duas
          # vezes no mesmo job.
          cache: 'true'
